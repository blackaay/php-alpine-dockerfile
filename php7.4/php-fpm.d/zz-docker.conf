[global]
daemonize = no
error_log = /proc/self/fd/2
rlimit_files = 65535
rlimit_core = 0
events.mechanism = epoll
[www]
access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
;listen = 9000
listen = /dev/shm/php-fpm.sock
listen.owner = nobody
listen.group = nobody
listen.mode = 0666
